[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "estatuto"
version = "1.0.0"
description = "El Estatuto: the framework standard and the Governed Employee Protocol (PEG/1) for the house of frameworks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Santiago Chiriboga", email = "chiribogamaldonadosantiago@gmail.com" }]
keywords = ["standard", "protocol", "governance", "agents", "framework"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.11,<3",
  "jsonschema>=4.25,<5",
]

[project.scripts]
estatuto = "estatuto.cli:main"

[project.urls]
Repository = "https://github.com/chiribogasantiago/el-estatuto"
Documentation = "https://github.com/chiribogasantiago/el-estatuto/tree/main/docs"

[dependency-groups]
dev = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.27,<1",
  "mypy>=1.17,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/estatuto"]

[tool.hatch.build.targets.sdist]
include = ["src/estatuto", "schemas", "gates", "README.md", "CHANGELOG.md", "LICENSE*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["src/estatuto/factory/template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]
"src/estatuto/factory/template/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/estatuto", "tests"]
exclude = ["src/estatuto/factory/template"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["estatuto"]
branch = true
omit = ["src/estatuto/factory/template/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
